[build-system]
requires = [
    "scikit-build-core",
    "numpy",
    "f90wrap @ git+https://github.com/jameskermode/f90wrap.git@05ba8ab50da57ff84221374e40478871be7de938",
]
build-backend = "scikit_build_core.build"

[project]
name = "libneo"
version = "0.0.4.dev0"
dependencies = ["numpy", "netCDF4"]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
chartmap = [
    "netCDF4",
    "map2disc @ git+https://github.com/itpplasma/map2disc.git@14da2f094ab2505a639b9cd04af57f5c0dbfaa54",
    "shapely",
    "scipy",
    "trimesh",
    "matplotlib",
]
dev = [
  "booz-xform",
  "scipy",
  "shapely",
  "matplotlib",
  "netCDF4",
  "h5py",
  "trimesh",
  "pytest",
  "map2disc @ git+https://github.com/itpplasma/map2disc.git@14da2f094ab2505a639b9cd04af57f5c0dbfaa54",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "scipy",
]

[project.scripts]
libneo-write-chartmap = "libneo.chartmap_cli:main"
libneo-booz-xform = "libneo.run_booz_xform:main"
nemec2vmec = "libneo.nemec2vmec:main"
neo2bc2chartmap = "libneo.neo2bc_to_chartmap:main"

[tool.scikit-build]
build-dir = "build/skbuild"
build.verbose = true

[tool.scikit-build.wheel.packages]
libneo = "python/libneo"
efit_to_boozer = "python/efit_to_boozer"
