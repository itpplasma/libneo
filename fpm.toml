name = "libneo"
version = "0.3.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Plasma Physics at TU Graz"

[dependencies]
fortio = { git = "https://github.com/lazy-fortran/fortio.git", rev = "11afd0bd1af0c99ea4e9a1c0df683dbdcc299b69" }
fortnum = { git = "https://github.com/lazy-fortran/fortnum.git", rev = "48f6f9bf0d4d523c3677bb686f5892f6e1329a24" }

[build]
external-modules = [
    "fftw3", "fftw3.f03",
    "omp_lib", "mpi", "mpi_f08",
    "openacc"
]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["pthread"]

[install]
library = true

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"
