name = "libneo"
version = "0.3.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Plasma Physics at TU Graz"

[dependencies]
fortio = { git = "https://github.com/lazy-fortran/fortio.git", rev = "6929247e03cc8657cc3f6aabf210525f16237fd7" }
fortnum = { git = "https://github.com/lazy-fortran/fortnum.git", rev = "23e36f8f7572d0104124073c349a1e0ea661749a" }
fortfem = { git = "https://github.com/lazy-fortran/fortfem.git", rev = "449f409fa628e6561f2270dc2c0b2001b41876c4" }

[build]
external-modules = [
    "fftw3", "fftw3.f03",
    "omp_lib", "mpi", "mpi_f08",
    "openacc"
]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["pthread"]

[install]
library = true

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"
